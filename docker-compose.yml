version: "3.8"

services:
  api:
    build: .
    container_name: news-rag-api

    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
      - qdrant
    environment:
      NODE_ENV: development
      PORT: 5000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ragdb
      DB_USER: postgres
      DB_PASSWORD: postgres

      REDIS_HOST: redis
      REDIS_PORT: 6379

      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: news_articles
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: rag-postgres
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rag-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    container_name: rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
